[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# NOTE: sqlalchemy.url is intentionally NOT set here.  alembic/env.py reads the
# single source of truth (app.config.settings.database_url) so the API and the
# migrations can never point at different databases.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
