server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never advertise the nginx version
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml font/woff2;

    # Hashed build assets never change -> cache them hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- REST API ----------------------------------------------------
    # $remote_addr (NOT $proxy_add_x_forwarded_for): the latter appends to a
    # client-supplied X-Forwarded-For, which would let a caller spoof the IP the
    # backend trusts for rate limiting.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ---- WebSocket game channel --------------------------------------
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Games are long-lived: never time out an active game
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    # ---- React Router SPA fallback -----------------------------------
    # Any unknown path is served index.html so /dashboard, /play/:pin etc. work
    # on a hard refresh or a shared link.
    location / {
        try_files $uri $uri/ /index.html;
    }
}